<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Simple Website - Home</title>

    <link rel="stylesheet" href="./css/homework.css" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>

  <body>
    <!-- HEADER -->

    <header>
      <div class="header-container">
        <div class="logo">
          <div class="logo-placeholder">LOGO</div>

          <div class="logo-name">Simple Website</div>
        </div>

        <nav>
          <a href="index.html">Home</a>
          <a href="lists.html">Lists</a>
          <a href="articles.html">Articles</a>
        </nav>

        <div class="language-switcher">
          <span id="en-button" class="active">EN</span>
          <span id="ua-button">UA</span>
        </div>

        <div class="header-buttons">
          <button>Registration</button>
          <button>Login</button>
        </div>
      </div>
    </header>

    <!-- MAIN CONTENT -->

    <main>
      <form id="registrationForm">
        <label for="username">Ім'я:</label>
        <input
          type="text"
          id="username"
          name="username"
          required
          minlength="2"
        />
        <br /><br />

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />
        <br /><br />

        <label for="password">Пароль:</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          minlength="8"
          maxlength="16"
        />
        <br /><br />
        <label for="repeatPassword">Повторіть пароль:</label>
        <input
          type="password"
          id="repeatPassword"
          name="repeatPassword"
          required
          minlength="8"
          maxlength="16"
        />
        <br /><br />

        <label for="birthDate">Дата народження:</label>
        <input type="date" id="birthDate" name="birthDate" required />
        <br /><br />

        <label for="role">Роль:</label>
        <select id="role" name="role" required>
          <option value="">Оберіть роль</option>
          <option value="student">Студент</option>
          <option value="teacher">Викладач</option>
          <option value="developer">Розробник</option>
        </select>
        <br /><br />

        <label>
          <input type="checkbox" id="agree" name="agree" required />
          Погоджуюся з правилами
        </label>
        <br /><br />

        <button type="submit">Зареєструватися</button>
      </form>
      <pre id="error-message"></pre>
    </main>

    <!-- FOOTER -->

    <footer>
      <div class="footer-container">
        <p>123 Example Street, Kyiv, Ukraine</p>

        <p>Phone: +380 44 123 45 67</p>
      </div>
    </footer>
    <script src="./scripts/form.js"></script>
  </body>
</html>
